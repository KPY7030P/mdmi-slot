function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }

function T(s, x, y, c = C.text, z = 2) {

    if (!hex) continue;
    const cx = x + i * 6 * z;

}

// ---------- algorithm picture ----------
function drawAlg(x, y, a, box, sx, sy, full) {
  const al = ALG[a];
  const pos = n => [x + al.p[n][0] * sx, y + al.p[n][1] * sy];
  const lw = full ? 2 : 1;
  const edge = full ? C.fmL : C.dim;
  al.e.forEach(([f, t]) => {
    const [fx, fy] = pos(f), [tx, ty] = pos(t);
    const y1 = fy + Math.floor(box / 2), y2 = ty + Math.floor(box / 2);
    if (y1 === y2) { R(fx + box, y1, tx - fx - box, lw, edge); return; }
    const mx = tx - Math.floor((sx - box) / 2);
    R(fx + box, y1, mx - fx - box, lw, edge);
    R(mx, Math.min(y1, y2), lw, Math.abs(y1 - y2) + lw, edge);
    R(mx, y2, tx - mx, lw, edge);
  });
  // output bus
  const maxCol = Math.max(...al.out.map(n => al.p[n][0]));
  const rowMid = y + sy + Math.floor(box / 2);
  if (a === 7) {
    const by = y + box + (full ? 24 : 6);
    al.out.forEach(n => { const [px] = pos(n); R(px + Math.floor(box / 2), y + box, lw, by - y - box, C.text); });
    R(x + Math.floor(box / 2), by, 3 * sx + box + (full ? 18 : 6) - Math.floor(box / 2), lw, C.text);
    if (full) T("OUT", x + 3 * sx + box + 20, by - 3, C.text, 1);
  } else {
    const bx = x + maxCol * sx + box + (full ? 12 : 4);
    const ys = al.out.map(n => pos(n)[1] + Math.floor(box / 2));
    al.out.forEach(n => { const [px, py] = pos(n); R(px + box, py + Math.floor(box / 2), bx - px - box, lw, C.text); });
    const top = Math.min(...ys, rowMid), bot = Math.max(...ys, rowMid);
    R(bx, top, lw, bot - top + lw, C.text);
    R(bx, rowMid, full ? 12 : 4, lw, C.text);
    if (full) T("OUT", bx + 15, rowMid - 3, C.text, 1);
  }
  for (let n = 1; n <= 4; n++) {
    const [px, py] = pos(n), car = al.out.includes(n);
    if (car) R(px, py, box, box, C.fm);
    else { R(px, py, box, box, C.bg); B(px, py, box, box, full ? C.fmL : C.sec); }
    if (full) TC(n, px, box, py + Math.floor((box - 14) / 2), car ? C.text : C.fmL);
  }
  if (full) { // feedback loop on operator 1
    const [px, py] = pos(1);
    R(px + 6, py - 6, box - 12, 2, C.warn);
    R(px + 6, py - 6, 2, 6, C.warn);
    R(px + box - 8, py - 6, 2, 6, C.warn);
    T("FB " + full.fb, px + box + 4, py - 8, C.warn, 1);
  }
}

// ---------- FM envelope, approximate. The mock only needs the shape. ----------
function egTime(rate) { return rate <= 0 ? Infinity : 120000 * Math.pow(2, -rate / 4); }
function eg(op, tk) {
  const ta = op.ar >= 31 ? 0 : op.ar === 0 ? Infinity : 20000 * Math.pow(2, -(2 * op.ar) / 4);
  const sl = op.sl === 15 ? 93 : op.sl * 3;
  const dt = sl === 0 ? 0 : egTime(2 * op.dr) * sl / 96;
  const sr = op.sr === 0 ? 0 : 96 / egTime(2 * op.sr);
  const rr = 96 / egTime(4 * op.rr + 2);
  const held = t => {
    if (ta > 0 && t < ta) return 96 * Math.pow(1 - t / ta, 3);
    if (dt > 0 && t < ta + dt) return isFinite(dt) ? sl * (t - ta) / dt : 0;
    return Math.min(96, sl + (t - ta - dt) * sr);
  };
  const at = t => t <= tk ? held(t) : Math.min(96, held(tk) + (t - tk) * rr);
  return { at, ta, dEnd: ta + dt, sl };
}
function drawEnvelope(op, x, y, w, h, car) {
  R(x, y, w, h, C.bg);
  B(x, y, w, h, C.panel);
  const T_MAX = 2000, TK = 1000;
  const toX = t => x + w * Math.sqrt(t / T_MAX);
  [10, 100].forEach(t => R(Math.round(toX(t)), y, 1, h, C.panel));
  const e = eg(op, TK), tl = op.tl * 0.75;
  const yOf = t => y + Math.min(h - 1, (Math.min(96, e.at(t) + tl) / 96) * (h - 1));
  for (let px = 0; px < w - 2; px += 2) {
    const t = T_MAX * Math.pow(px / w, 2);
    const yy = Math.round(yOf(t));
    if (y + h - yy > 1) R(x + 1 + px, yy, 2, y + h - yy - 1, car ? C.fmD : C.panel);
  }
  let lx = x, ly = yOf(0);
  for (let px = 2; px < w; px += 2) {
    const t = T_MAX * Math.pow(px / w, 2), yy = yOf(t);
    L(lx, ly, x + px - 1, yy, car ? C.text : C.fmL);
    lx = x + px - 1; ly = yy;
  }
  const kx = Math.round(toX(TK));
  R(kx, y, 1, h, C.dim);
  T("OFF", kx + 3, y + 3, C.dim, 1);
  const handle = t => { if (t < T_MAX && isFinite(t)) R(Math.round(toX(t)) - 2, Math.round(yOf(t)) - 2, 6, 6, C.text); };
  handle(e.ta);
  handle(e.dEnd);
}

  const lab = (t, x, y) => T(t, x, y + 3, C.sec);
  const X1 = 572, X2 = 760, CW1 = 116, CW2 = 132;
  const AMS = ["0 dB", "1 dB", "6 dB", "12 dB"], FMS = ["0 %", "3 %", "6 %", "10 %", "14 %", "20 %", "40 %", "80 %"];
  lab("FB", X1, 84);  cell(X1 + 60, 84, CW1, 20, p.fb, 7, p.fb);
  lab("AMS", X1, 108); cell(X1 + 60, 108, CW1, 20, p.ams, 3, AMS[p.ams]);
  lab("FMS", X1, 132); cell(X1 + 60, 132, CW1, 20, p.fms, 7, FMS[p.fms]);
  if (i === 2 && S.ch3sp) {
    T("Op 1-3 pitch", X1, 170, C.lit);
    T("from MIDI 11-13", X1, 190, C.lit);
  } else {
    T(c.note ? noteName(c.note) : "---", X1, 168, c.note ? C.lit : C.line, 3);
    T(c.note ? "key on" : "key off", X1 + 64, 174, c.note ? C.lit : C.dim);
  }
  lab("VOL", X2, 84); cell(X2 + 60, 84, CW2, 20, c.vol, 127, c.vol);
  lab("PAN", X2, 108);
  ["L", "C", "R"].forEach((n, q) => btn(n, X2 + 60 + q * 45, 108, 42, 20, { on: c.pan === q }));
  lab("TUNE", X2, 132); cell(X2 + 60, 132, CW2, 20, c.tune + 64, 127, (c.tune >= 0 ? "+" : "") + c.tune + " ct");
  lab("BEND", X2, 156); cell(X2 + 60, 156, CW2, 20, c.bend, 24, c.bend + " st");
  lab("PORT", X2, 180);
  if (S.poly) { R(X2 + 60, 180, CW2, 20, C.panel); TR("not in poly", X2 + 60 + CW2 - 4, 183, C.line); }
  else cell(X2 + 60, 180, CW2, 20, c.porta, 127, c.porta ? c.porta : "off");

  // operator columns
  R(289, 236, 671, 1, C.panel);
  const LX = 296, X0 = 344, CW = 148, GAP = 4;
  const ROWS = [
    ["TL", "tl", 127], ["MUL", "mul", 15], ["DT", "dt", 7], null,
    ["AR", "ar", 31], ["DR", "dr", 31], ["SL", "sl", 15], ["SR", "sr", 31], ["RR", "rr", 15], null,
    ["RS", "rs", 3], ["AM", "am", 1], ["SSG", "ssg", 15],
  ];
  const al = ALG[p.alg];
  T("ENV", LX, 312, C.sec);
  p.ops.forEach((op, o) => {
    const x = X0 + o * (CW + GAP), car = al.out.includes(o + 1);
    if (car) { R(x, 240, CW, 22, C.fm); } else { B(x, 240, CW, 22, C.fmL); }
    T("OP" + (o + 1), x + 6, 244, car ? C.text : C.fmL);
    T(car ? "CARRIER" : "MOD", x + 46, 248, car ? C.text : C.fmL, 1);
    if (i === 2 && S.ch3sp) {
      const nn = [60, 64, 67, 0][o];
      TR(nn ? noteName(nn) : "ch 3", x + CW - 6, 244, nn ? C.lit : car ? C.text : C.fmL);
    }
    drawEnvelope(op, x, 266, CW, 112, car);
  });
  let y = 384;
  ROWS.forEach(r => {
    if (!r) { y += 8; return; }
    T(r[0], LX, y + 2, C.sec);
    p.ops.forEach((op, o) => {
      const x = X0 + o * (CW + GAP);
      const v = op[r[1]];
      let txt = String(v);
      if (r[1] === "ssg") txt = v < 8 ? "off" : "Env " + (v - 7);
      if (r[1] === "am") txt = v ? "on" : "off";
      const over = r[1] === "sr" && v > 15;
      cell(x, y, CW, 20, v, r[2], txt, over ? C.dacD : C.fmD, over ? C.warn : C.text);
      if (over) T("CC: 15 max", x + 6, y + 6, C.warn, 1);
    });
    y += 22;
  });
}

function drawPSG(i) {
  const c = S.ch[i];
  const env = c.pr === 80 ? ENVSQ : ENV0;
  const X0 = 340, ST = 13;
  const n = env.steps.length;
  // section strip
  const ax = X0 + env.a * ST, bx = X0 + env.b * ST, ex = X0 + n * ST;
  R(X0, 88, ax - X0 - 1, 20, C.psgD);
  if (ax - X0 > 80) T("ONSET", X0 + 6, 91, C.psg);
  R(ax, 88, bx - ax - 1, 20, C.text);
  TC(bx - ax > 60 ? "LOOP" : "L", ax, bx - ax, 91, C.bg);
  R(bx, 88, ex - bx - 1, 20, C.psgD);
  if (ex - bx > 90) T("RELEASE", bx + 6, 91, C.psg);
  // drag handles
  R(ax - 2, 84, 4, 28, C.warn);
  R(bx - 2, 84, 4, 28, C.warn);

  // level cells
  const Y0 = 116, CH = 16;
  R(ax, Y0, bx - ax - 1, 15 * CH, C.panel);
  for (let l = 0; l <= 15; l += 5) {
    const yy = Y0 + l * CH;
    T(l === 0 ? "0 dB" : "-" + l * 2, 296, yy - 3, C.dim, 1);
    R(330, yy, 8, 1, C.dim);
  }
  env.steps.forEach((v, s) => {
    const att = v & 15, lev = 15 - att, x = X0 + s * ST;
    const inLoop = s >= env.a && s < env.b;
    for (let q = 0; q < lev; q++) {
      const top = q === lev - 1;
      const col = inLoop ? (top ? C.text : C.dim) : top ? C.psg : C.psgD;
      R(x, Y0 + (14 - q) * CH + 1, ST - 1, CH - 1, col);
    }
    if (lev === 0) R(x, Y0 + 15 * CH - 2, ST - 1, 2, C.line);
    TC(att.toString(16).toUpperCase(), x, ST - 1, Y0 + 15 * CH + 6, inLoop ? C.text : C.sec, 1);
    if (s % 8 === 0) T(s, x, 462, C.dim, 1);
  });
  // new step ghost
  B(ex, Y0, ST - 1, 15 * CH, C.line);
  TC("+", ex, ST - 1, Y0 + 15 * CH + 6, C.dim, 1);
  T("ATT", 296, Y0 + 15 * CH + 6, C.sec, 1);

  // pitch lane
  const PY = 382;
  T("PITCH", 296, PY + 12, C.sec, 1);
  T("assumed", 296, PY + 24, C.warn, 1);
  R(X0, PY, n * ST, 64, C.panel);
  R(X0, PY + 32, n * ST, 1, C.line);
  env.steps.forEach((v, s) => {
    const hi = v >> 4;
    if (hi) {
      const x = X0 + s * ST;
      R(x, PY + 22, ST - 1, 20, C.warn);
      TC(hi.toString(16).toUpperCase(), x, ST - 1, PY + 28, C.bg, 1);
    }
  });
  T("STEP", 296, 462, C.sec, 1);

  // applies to
  T("APPLIES TO", 296, 486, C.sec);
  btn("CH " + (i + 1) + " ONLY", 424, 480, 120, 28, { on: true, color: C.psg });
  btn("ALL PSG", 548, 480, 120, 28);
  T("ROM may have a single user slot: unconfirmed", 680, 490, C.warn, 1);

  // starting points
  T("START FROM ROM", 296, 524, C.sec);
  [["Envelope 0", ENV0], ["Square Lead", ENVSQ]].forEach(([name, e], q) => {
    const x = 296 + q * 172, cur = e === env;
    B(x, 546, 164, 64, cur ? C.psg : C.line);
    T(name, x + 6, 552, cur ? C.text : C.sec);
    e.steps.forEach((v, s) => {
      const l = 15 - (v & 15);
      const bw = e.steps.length > 20 ? 3 : 6;
      R(x + 6 + s * bw, 604 - l * 2, bw - 1, l * 2, s >= e.a && s < e.b ? C.sec : C.psg);
    });
  });
  B(640, 546, 312, 64, C.panel);
  T("Drop envelope file here", 652, 556, C.dim);
  T("or on rows 7-10", 652, 578, C.dim);
  T("1 step = time not confirmed, so the axis counts steps", 296, 624, C.dim, 1);
  if (i === 9) T("Channel 10 is noise. Same editor. Pitch lane only if research says it applies.", 296, 640, C.dim, 1);
}

function twoLines(name) {
  if (name.length <= 8) return [name, ""];
  for (let i = name.length - 1; i > 0; i--) {
    if (name[i] >= "A" && name[i] <= "Z" && i <= 8) return [name.slice(0, i), name.slice(i, i + 8)];
  }
  return [name.slice(0, 8), name.slice(8, 16)];
}
function drawDAC() {
  btn("NOTES", 296, 88, 112, 24, { on: true, color: C.dac });
  btn("AUDIO IN", 412, 88, 112, 24, { dis: true });
  T("unconfirmed, reserved", 532, 96, C.dim, 1);
  T("CH 6 plays one sample at a time", 696, 94, C.sec, 1);
  const X0 = 332, CW = 51, CH = 42, Y0 = 136;
  ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"].forEach((n, q) => TC(n, X0 + q * CW, CW, 122, C.sec, 1));
  for (let oct = 0; oct < 6; oct++) {
    const y = Y0 + oct * CH;
    T("C-" + (oct + 1), 296, y + 14, C.sec);
    for (let q = 0; q < 12; q++) {
      const p = 24 + oct * 12 + q, x = X0 + q * CW, name = SAMPLES[p];
      const playing = p === 34, sel = p === S.dacSel;
      if (playing) R(x, y, CW - 1, CH - 1, C.lit);
      else if (name) R(x, y, CW - 1, CH - 1, C.dacD);
      else B(x, y, CW - 1, CH - 1, C.panel);
      if (sel) B(x, y, CW - 1, CH - 1, C.text, 2);
      if (name) {
        const tc = playing ? C.bg : C.text;
        const [a, b] = twoLines(name);
        T(a, x + 3, y + 8, tc, 1);
        T(b, x + 3, y + 22, tc, 1);
        hit(x, y, CW, CH, () => { S.dacSel = p; draw(); });
      }
    }
  }
  // selected sample
  const dy = 396;
  R(289, dy, 671, 1, C.line);
  T(noteName(S.dacSel), 296, dy + 12, C.lit, 3);
  T(SAMPLES[S.dacSel] || "empty", 360, dy + 12, C.text);
  T("22050 Hz  built into the ROM", 360, dy + 30, C.sec, 1);
  btn("REPLACE", 700, dy + 10, 124, 28);
  btn("CLEAR", 828, dy + 10, 124, 28);
  const wy = dy + 52, ww = 656, wh = 96;
  R(296, wy, ww, wh, C.panel);
  let seed = S.dacSel * 7919 + 13;
  for (let x = 0; x < ww; x += 2) {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    const a = (seed % 100) / 100 * Math.exp(-x / 120) * (wh / 2 - 2);
    R(296 + x, wy + wh / 2 - a, 2, Math.max(1, a * 2), C.dac);
  }
  T("The ROM's DAC code ignores volume, pan and pitch. Note off stops the sample.", 296, wy + wh + 14, C.sec, 1);
  T("Toggling DAC resets the YM2612: sounding FM notes stop.", 296, wy + wh + 28, C.warn, 1);
  T("Drop a WAV on a note cell (only if a custom sample path into the ROM is confirmed).", 296, wy + wh + 42, C.dim, 1);
}

function drawPicker(i) {
  R(289, 80, 671, 592, C.bg);
  const k = kind(i);
  if (k !== "fm") {
    T("ROM envelopes", 296, 92, C.sec);
    T("128 program numbers. In the ROM's table they point at 2 distinct envelopes.", 296, 116, C.sec, 1);
    btn("Envelope 0", 296, 136, 200, 32, { on: S.ch[i].pr === 0, color: C.psg, fn: () => { S.ch[i].pr = 0; S.picker = false; draw(); } });
    btn("Square Lead", 500, 136, 200, 32, { on: S.ch[i].pr === 80, color: C.psg, fn: () => { S.ch[i].pr = 80; S.picker = false; draw(); } });
    return;
  }
  const X0 = 296, Y0 = 84, CW = 165, RH = 18;
  for (let n = 0; n < 128; n++) {
    const col = Math.floor(n / 32), row = n % 32;
    const x = X0 + col * CW, y = Y0 + row * RH;
    if (n === S.ch[i].pr) R(x, y, CW - 3, RH - 1, C.text);
    T(cut(GM[n], 13), x + 2, y + 2, n === S.ch[i].pr ? C.bg : C.text);
    hit(x, y, CW, RH, () => { S.ch[i].pr = n; S.picker = false; S.dropped = false; draw(); });
    if (n % 8 === 0 && row !== 0) R(x, y - 1, CW - 3, 1, C.line);
  }
}

// ---------- header and footer ----------
function drawHeader() {
  const lost = S.stage === 2;
  R(0, 0, W, 32, lost ? C.err : C.bg);
  R(0, 31, W, 1, lost ? C.err : C.line);
  T("MDMI", 12, 9, lost ? C.bg : C.fmL);
  const on = lost ? C.bg : C.text, tc = lost ? C.err : C.bg;
  btn("EDITOR", 72, 4, 100, 24, { on: S.view === "editor", color: on, tc: S.view === "editor" ? tc : lost ? C.bg : C.sec, border: lost ? C.bg : C.line, fn: () => { S.view = "editor"; draw(); } });
  btn("ROM", 176, 4, 100, 24, { on: S.view === "rom", color: on, tc: S.view === "rom" ? tc : lost ? C.bg : C.sec, border: lost ? C.bg : C.line, fn: () => { S.view = "rom"; draw(); } });
  if (lost) {
    T("CONSOLE LOST", 300, 4, C.bg, 3);
    R(700, 4, 252, 24, C.bg);
    TC("EMU IS LIVE", 700, 252, 9, C.lit);
    return;
  }
  T("BANK", 296, 12, C.dim, 1);
  T("Set 1*", 328, 9, C.text);
  btn("LOAD", 412, 4, 56, 24);
  btn("SAVE", 472, 4, 56, 24);
  // stage slot: same place, today and later
  if (S.stage === 0) {
    R(700, 4, 120, 24, C.lit);
    TC("EMU LIVE", 700, 120, 9, C.bg);
    B(824, 4, 128, 24, C.panel);
    TC("no console", 824, 128, 9, C.line);
  } else {
    B(700, 4, 120, 24, C.sec);
    TC("EMU ready", 700, 120, 9, C.sec);
    R(824, 4, 128, 24, C.lit);
    TC("CON LIVE", 824, 128, 9, C.bg);
  }
}
function drawFooter() {
  R(0, 672, W, 32, C.bg);
  R(0, 672, W, 1, C.line);
  const col = S.msgKind === "err" ? C.err : S.msgKind === "warn" ? C.warn : C.sec;
  if (S.msg) T(S.msg, 12, S.msg.length > 44 ? 684 : 681, col, S.msg.length > 44 ? 1 : 2);
  else T("Drop VGI, TYI, TFI on FM, envelopes on PSG", 12, 684, C.dim, 1);
  if (S.undo) btn("UNDO", 500, 676, 64, 24, { tc: C.text, border: C.text, fn: () => { S.dropped = false; S.undo = false; S.msg = ""; draw(); } });
  T("LFO", 584, 681, C.dim); T("3.98Hz", 624, 681, C.text);
  T("FLT", 712, 681, C.dim); T("3392", 752, 681, C.text);
  T("POLY", 820, 681, C.dim);
  T(S.poly ? "ON" : "off", 876, 681, S.poly ? C.warn : C.text);
  hit(820, 672, 100, 32, () => { S.poly = !S.poly; if (S.poly && S.page !== "all" && S.page > 0 && S.page < 6) S.page = 0; draw(); });
}

function draw() {
  hits = [];
  R(0, 0, W, H, C.bg);
  drawHeader();
  if (S.view === "rom") {
    if (romImg.complete && romImg.naturalWidth) {
      g.imageSmoothingEnabled = false;
      g.drawImage(romImg, 13, 9, 320, 224, 0, 32, 960, 672);
    }
    if (S.romDrag) { drawRail(true); }
    return;
  }
  drawRail(false);
  if (S.page === "all") drawAll();
  else {
    const i = S.page, k = kind(i);
    drawHead(i);
    if (S.picker) drawPicker(i);
    else if (k === "fm") drawFM(i);
    else if (k === "dac") drawDAC();
    else drawPSG(i);
  }
  drawFooter();
}
const W = 960, H = 704;

cv.addEventListener("click", e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && y >= h.y && x < h.x + h.w && y < h.y + h.h) { h.fn(); return; }
  }
});
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  cv.style.cursor = hits.some(h => x >= h.x && y >= h.y && x < h.x + h.w && y < h.y + h.h) ? "pointer" : "default";
});

// ---------- screens of the mock (the buttons above the canvas are not part of the plugin) ----------
const SCREENS = [
  ["Overview", "Домашний экран: все каналы одной таблицей. Левая колонка («рельс») есть всегда, правая часть дополняет те же строки. Клик по строке открывает канал.", s => {}],
  ["FM: Rhodes", "Алгоритм нарисован как есть, несущие залиты, модуляторы контуром. Огибающие настоящие: TL опускает кривую, время общее для всех операторов. Значения из presets_gm.h (форма огибающих в мокапе приближённая).", s => { s.page = 1; }],
  ["FM: Bass", "Другой алгоритм, другие значения: Synth Bass 1, чтобы видеть, как меняется картинка.", s => { s.page = 0; }],
  ["Preset list", "Самое частое действие на канале: выбрать звук. Все 128 сразу на экране, без прокрутки. Клик загружает.", s => { s.page = 1; s.picker = true; }],
  ["Ch3 Special", "Канал 3 в особом режиме: у операторов 1-3 свои ноты (MIDI 11-13), это видно в заголовках колонок и в строке 3.", s => { s.page = 2; s.ch3sp = true; }],
  ["PSG envelope", "Столбики из 15 реальных шагов уровня, петля и хвост после неё как разметка сверху, сырые значения под столбиками. Данные: ENVELOPE_0 из envelopes.c, чтение формата не подтверждено.", s => { s.page = 6; }],
  ["DAC map", "Канал 6 в режиме DAC. Карта нот из pcm_sample.c, как в коде ROM. Волна выбранного сэмпла условная. AUDIO IN только занимает место.", s => { s.page = 5; s.dac = true; }],
  ["ROM screen", "Переключатель EDITOR / ROM на одном месте, один клик. Картинка ROM ровно 3x в окне 960x704.", s => { s.view = "rom"; }],
  ["Drag: hover", "Файл инструмента над окном: подсвечены только каналы, куда он подходит. Строка под курсором говорит, что будет.", s => { s.drag = "fm"; s.hover = 1; s.msg = "bass_slap.tfi: replaces Rhodes on CH 2"; s.msgKind = "warn"; }],
  ["Drag over ROM", "То же, но открыт экран ROM: рельс временно выезжает поверх картинки и исчезает после броска.", s => { s.view = "rom"; s.romDrag = true; s.drag = "fm"; s.hover = 1; }],
  ["Drag: envelope", "Файл огибающей: цели только PSG.", s => { s.drag = "psg"; s.hover = 7; s.msg = "pluck.eef: replaces Square Lead on CH 8"; s.msgKind = "warn"; }],
  ["Loaded, warning", "Файл загружен, но одно значение не проходит через CC: SR 22 на операторе 2. Об этом сказано внизу и в ячейке SR оператора 2. UNDO рядом.", s => { s.dropped = true; s.undo = true; s.msg = "bass_slap.tfi: Op2 SR 22, CC max 15"; s.msgKind = "warn"; s.page = 1; }],
  ["Bad file", "Файл не читается: канал не тронут, причина внизу.", s => { s.msg = "broken.tfi: 17 bytes. CH 2 unchanged"; s.msgKind = "err"; }],
  ["Polyphony", "Polyphony включена: все FM-голоса принадлежат каналу 1. Строки 2-6 показывают ноты, но патч у них общий. Клик по ним ведёт на канал 1.", s => { s.poly = true; }],
  ["Stage: console", "Позже. Приставка играет, эмулятор наготове. Это то же место в заголовке, где сегодня только EMU LIVE.", s => { s.stage = 1; }],
  ["Stage: lost", "Позже. Приставка отвалилась: весь заголовок красный, читается через сцену, эмулятор уже играет.", s => { s.stage = 2; }],
];
const nav = document.getElementById("nav"), cap = document.getElementById("cap");
function show(n) {
  S = freshState();
  SCREENS[n][2](S);
  cap.textContent = SCREENS[n][1];
  [...nav.children].forEach((b, i) => b.className = i === n ? "on" : "");
  draw();
}
SCREENS.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = s[0];
  b.onclick = () => show(i);
  nav.appendChild(b);
});
// One canvas pixel = a whole number of screen pixels, the way the plugin would scale.
const dpr = window.devicePixelRatio || 1;
const k = Math.max(1, Math.round(dpr));
cv.style.width = W * k / dpr + "px";
cv.style.height = H * k / dpr + "px";
show(0);
</script>
